<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="apple-mobile-web-app-capable"
      content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style"
      content="black-translucent" />
    <meta name="apple-mobile-web-app-title"
      content="Mult CRM" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon"
      href="/favicon.ico" />
    <link rel="icon" type="image/png"
      sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png"
      sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon"
      sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Fonts -->
    <link rel="preconnect"
      href="https://fonts.googleapis.com" />
    <link rel="preconnect"
      href="https://fonts.gstatic.com" crossorigin />

    <!-- SEO fallback -->
    <title>Mult Flooring — Hardwood Installation
      MA, RI & CT</title>
    <meta name="description"
      content="Professional hardwood, vinyl and laminate
      flooring installation serving MA, RI and CT." />

    <!-- Geo tags -->
    <meta name="geo.region" content="US-MA" />
    <meta name="geo.placename"
      content="West Bridgewater, Massachusetts" />
    <meta name="geo.position"
      content="42.0154;-71.0089" />
    <meta name="ICBM"
      content="42.0154, -71.0089" />

    <!-- Robots -->
    <meta name="robots"
      content="index, follow,
               max-image-preview:large" />
    <meta name="language" content="English" />
    <meta name="author" content="Mult Flooring" />

    <!-- OG Image correto -->
    <meta property="og:image"
      content="https://multflooring.com/og-image.jpg" />
    <meta name="twitter:image"
      content="https://multflooring.com/og-image.jpg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
